name: media-loader

services:
  api:
    image: media-loader-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: media-loader-api
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TEMP_DIR: /app/tmp/media-loader
    ports:
      - "8000:8000"
    volumes:
      - media-output:/app/tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    image: media-loader-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: media-loader-worker
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TEMP_DIR: /app/tmp/media-loader
    volumes:
      - media-output:/app/tmp
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: media-loader-tunnel
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    command: tunnel --no-autoupdate run --url http://api:8000
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - tunnel

volumes:
  media-output:
