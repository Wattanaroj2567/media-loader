name: media-loader

services:
  media-output-init:
    image: media-loader-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test ! -L /app/tmp/media-loader &&
        mkdir -p /app/tmp/media-loader &&
        test -d /app/tmp/media-loader &&
        chown 10001:10001 /app/tmp/media-loader
    volumes:
      - media-output:/app/tmp

  ssrf-proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile
    container_name: media-loader-ssrf-proxy
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3128:3128"
    networks:
      - api-egress
      - worker-egress
      - proxy-internet
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 3128), timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    image: media-loader-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: media-loader-api
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TEMP_DIR: /app/tmp/media-loader
      MEDIA_EGRESS_PROXY: http://ssrf-proxy:3128
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
      http_proxy: http://ssrf-proxy:3128
      https_proxy: http://ssrf-proxy:3128
      NO_PROXY: ""
      no_proxy: ""
    networks:
      - api-egress
      - api-access
    depends_on:
      media-output-init:
        condition: service_completed_successfully
      ssrf-proxy:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media-output:/app/tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import build_opener, ProxyHandler; build_opener(ProxyHandler({})).open('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    image: media-loader-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: media-loader-worker
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TEMP_DIR: /app/tmp/media-loader
      MEDIA_EGRESS_PROXY: http://ssrf-proxy:3128
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
      http_proxy: http://ssrf-proxy:3128
      https_proxy: http://ssrf-proxy:3128
      NO_PROXY: ""
      no_proxy: ""
    networks:
      - worker-egress
    volumes:
      - media-output:/app/tmp
    depends_on:
      api:
        condition: service_healthy
      ssrf-proxy:
        condition: service_healthy
    stop_grace_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: media-loader-tunnel
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    command: tunnel --no-autoupdate --url http://api:8000
    networks:
      - api-access
      - proxy-internet
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - tunnel

volumes:
  media-output:

networks:
  api-egress:
    internal: true
  worker-egress:
    internal: true
  api-access:
    internal: true
  proxy-internet:
