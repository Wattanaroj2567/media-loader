services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: media-loader-api
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./tmp:/app/tmp
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: media-loader-worker
    env_file:
      - .env.local
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./tmp:/app/tmp
    command: python -m worker.main
    depends_on:
      - api
