name: Supabase Keep-Alive Ping

on:
  schedule:
    # Run every 3 days at 05:00 UTC (12:00 PM Bangkok Time) to prevent Supabase Free Tier auto-pause (7-day inactivity limit)
    - cron: '0 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    name: Ping Supabase Database & Auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send keep-alive ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY) in repository Actions secrets."
            echo "Please configure them in Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          # Strip trailing slash from URL
          CLEAN_URL="${SUPABASE_URL%/}"

          ping_endpoint() {
            local endpoint="$1"
            # API keys belong in apikey. Publishable keys are not JWT bearer tokens.
            curl --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" "$endpoint" || true
          }

          for attempt in 1 2; do
            # The OpenAPI root requires elevated keys. Exercise the DB without returning rows.
            REST_HTTP_CODE=$(ping_endpoint "$CLEAN_URL/rest/v1/profiles?select=id&limit=0")
            AUTH_HTTP_CODE=$(ping_endpoint "$CLEAN_URL/auth/v1/health")
            echo "Attempt $attempt - REST: $REST_HTTP_CODE, Auth: $AUTH_HTTP_CODE"

            if [[ "$REST_HTTP_CODE" =~ ^2[0-9]{2}$ ]] && [[ "$AUTH_HTTP_CODE" =~ ^2[0-9]{2}$ ]]; then
              echo "Success: Supabase REST and Auth services are responding."
              exit 0
            fi

            if [[ "$REST_HTTP_CODE" =~ ^40[13]$ ]] || [[ "$AUTH_HTTP_CODE" =~ ^40[13]$ ]]; then
              echo "::error::Supabase rejected the request (401/403). Verify that the Actions URL and publishable/anon key belong to the same active project and that the key is valid. Also check Data API access settings."
              exit 1
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "Error: Supabase REST or Auth did not return a successful 2xx response."
          exit 1
