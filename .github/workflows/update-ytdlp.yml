name: Monthly yt-dlp Auto-Update

on:
  schedule:
    # Run on the first day of every month at 03:17 UTC.
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-ytdlp:
    name: Bump yt-dlp & Verify Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Upgrade yt-dlp in API and Worker
        run: |
          uv lock --directory apps/api --upgrade-package yt-dlp
          uv lock --directory apps/worker --upgrade-package yt-dlp

      - name: Verify both lockfiles resolve the same yt-dlp version
        id: get_version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          versions = {}
          for service in ("api", "worker"):
              lock = tomllib.loads(Path(f"apps/{service}/uv.lock").read_text(encoding="utf-8"))
              versions[service] = next(
                  package["version"] for package in lock["package"] if package["name"] == "yt-dlp"
              )

          if versions["api"] != versions["worker"]:
              raise SystemExit(f"yt-dlp version mismatch: {versions}")
          print(f"version={versions['api']}")
          PY

      - name: Check for lockfile changes
        id: check_diff
        run: |
          if git diff --quiet apps/api/uv.lock apps/worker/uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp is already up to date. No changes needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "yt-dlp updates detected in lockfiles."
          fi

      - name: Run API Tests
        if: steps.check_diff.outputs.changed == 'true'
        working-directory: apps/api
        run: |
          uv run --locked --extra dev pytest

      - name: Run Worker Tests
        if: steps.check_diff.outputs.changed == 'true'
        working-directory: apps/worker
        run: |
          uv run --locked --extra dev pytest

      - name: Create Pull Request
        if: steps.check_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: deps/monthly-ytdlp-update
          delete-branch: true
          title: "chore(deps): bump yt-dlp to ${{ steps.get_version.outputs.version }}"
          commit-message: "chore(deps): bump yt-dlp to ${{ steps.get_version.outputs.version }}"
          body: |
            ### Automated Monthly yt-dlp Update

            - **Target packages**: `apps/api` and `apps/worker`
            - **New yt-dlp version**: `${{ steps.get_version.outputs.version }}`
            - **Validation**: Both `apps/api` and `apps/worker` pytest suites passed successfully.

            This PR was generated automatically by the monthly yt-dlp maintenance workflow.
          labels: |
            dependencies
            automated
