[project]
name = "media-loader-api"
version = "0.1.0"
description = "FastAPI backend for Media Loader — policy checks, URL analysis, and job creation"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.3.0",
    "yt-dlp[default]>=2024.3.10",
    "curl_cffi>=0.6.0",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning"
]
