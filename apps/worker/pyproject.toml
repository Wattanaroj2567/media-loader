[project]
name = "media-loader-worker"
version = "0.1.0"
description = "Python media worker for Media Loader — queue polling, download, conversion, and upload"
requires-python = ">=3.12"

dependencies = [
    "yt-dlp[default]>=2024.3.10",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "curl_cffi>=0.6.0,<0.16.0",
    "imageio-ffmpeg>=0.6.0",
]

[tool.setuptools]
packages = ["worker"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.9.0",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.vulture]
min_confidence = 80
paths = ["worker"]
