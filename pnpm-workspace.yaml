packages:
  - "apps/*"
  - "packages/*"

# Keep vulnerable transitive dependencies on compatible patched releases.
overrides:
  "@esbuild-kit/core-utils>esbuild": ">=0.25.0 <0.26"
  "browserslist@<4.28.7": ">=4.28.7 <5"
  "baseline-browser-mapping@<2.11.0": ">=2.11.0 <3"
  "brace-expansion@<1.1.21": ">=1.1.21 <2"
  "brace-expansion@>=5 <5.0.12": ">=5.0.12 <6"
  "fast-uri@>=3 <3.1.9": ">=3.1.9 <4"
  "ip-address@>=10 <10.7.4": ">=10.7.4 <11"
  "js-yaml@>=4 <4.3.2": ">=4.3.2 <4.4"
  "katex@>=0.16 <0.18.2": ">=0.18.2 <0.19"
  "minimatch@>=10 <11.0.1": ">=11.0.1 <12"
  "postcss@>=8 <8.5.23": ">=8.5.23 <9"
  "postcss-selector-parser@>=7 <7.1.6": ">=7.1.6 <8"
  "re2js@>=2 <2.8.7": ">=2.8.7 <2.9"
  "shell-quote@>=1 <1.11.0": ">=1.11.0 <1.12"
  "source-map-js@>=1 <1.2.2": ">=1.2.2 <1.3"
  "systeminformation@<5.33.13": ">=5.33.13 <6"
  "undici@>=7 <7.30.1": ">=7.30.1 <8"
  "zod@>=4 <4.6.6": ">=4.6.6 <5"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Allow these packages to run post-install build scripts across the workspace
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild

patchedDependencies:
  drizzle-kit: patches/drizzle-kit.patch
